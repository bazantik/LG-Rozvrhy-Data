name: Automaticky stahnout rozvrhy

on:
  schedule:
    # Spustí se automaticky každý den od 5:00 UTC (v ČR to je v 6:00, resp. 7:00 v létě)
    # 1. BLOK: Od 07:00 do 15:00 našeho letního času (každou hodinu)
    # V UTC je to 05:00 až 13:00. Zápis 5-13 znamená "každou hodinu od 5 do 13".
    - cron: '17 5-13 * * *'
    
    # 2. BLOK: 17:00, 19:00, 21:00 a 00:00 našeho letního času
    # V UTC je to 15:00, 17:00, 19:00 a 22:00.
    - cron: '17 15,17,19,22 * * *'
  workflow_dispatch: # Umožňuje ruční spuštění pomocí tlačítka "Run workflow"

# TÍMTO BOTOVI POVOLÍME ZÁPIS (Push) ZPĚT DO REPOZITÁŘE
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    # 1. POJISTKA PROTI ZOMBIE BĚHŮM: Zabrání spálení minut, pokud Bakaláři spadnou
    timeout-minutes: 10

    steps:
      - name: Stáhnutí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace knihoven a prohlížeče
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Spuštění stahovacího skriptu
        run: python scraper.py

      - name: Uložení a nahrání změn (Commit and push)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Přidáme pouze náš JSON soubor
          git add ucitele.json
          
          # 2. CHYTRÝ COMMIT: Pokud se rozvrh nezměnil, kód nespadne, jen vypíše zprávu
          git commit -m "Automatická aktualizace rozvrhu" || echo "Žádné nové změny v rozvrhu. Soubor zůstává stejný."
          
          # 3. POJISTKA PROTI KONFLIKTŮM: Stáhne případné tvé manuální zásahy na webu před odesláním
          git pull --rebase
          
          # 4. Nahrání na GitHub
          git push
