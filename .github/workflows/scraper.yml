name: Automaticky stahnout rozvrhy

on:
  schedule:
    # 1. BLOK: Od 07:00 do 15:00 našeho letního času (každou hodinu v 17. minutě)
    - cron: '17 5-13 * * *'
    
    # 2. BLOK: 17:00, 19:00, 21:00 a 00:00 našeho letního času
    - cron: '17 15,17,19,22 * * *'
  workflow_dispatch:

# ZÁMEK: Nechá běžící scraper vždy dokončit běh
concurrency:
  group: scraper-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stáhnutí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace knihoven a prohlížeče
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Spuštění stahovacího skriptu
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python scraper.py

      - name: Uložení a nahrání změn (Commit and push)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 1. Pokud skript soubor vůbec nezměnil, skončíme čistě bez commitu
          if git diff --quiet ucitele.json; then
            echo "Žádné nové změny v rozvrhu. Soubor zůstává stejný."
            exit 0
          fi
          
          # 2. Zálohujeme čerstvě vygenerovaný JSON do dočasné paměti
          cp ucitele.json /tmp/ucitele.json
          
          # 3. Získáme nejnovější stav větve main ze serveru
          git fetch origin main
          git reset --hard origin/main
          
          # 4. Vrátíme náš nově vygenerovaný JSON zpět
          cp /tmp/ucitele.json ucitele.json
          
          # 5. Zkontrolujeme, zda se náš nový JSON liší od toho, co už je na serveru
          git add ucitele.json
          if git diff --staged --quiet; then
            echo "Data na serveru jsou již identická s vygenerovanými."
          else
            git commit -m "Automatická aktualizace rozvrhu"
            git push origin main
          fi
